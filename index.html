<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Zoom AI</title>
<style>
:root{--bg:#000;--fg:#fff;--side:#262626;--on:#ffd33d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:flex;flex-direction:column}
#vf{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#111;border-radius:22px}
#vf video,#vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
#vf::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35))}
#msg,#tip{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;opacity:.85;font-size:15px;z-index:2}
#tip{top:auto;bottom:130px;transform:none;background:rgba(0,0,0,.6);border-radius:12px;padding:8px;font-size:13px}
#zl{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:5px 14px;font-size:14px;font-weight:600;z-index:2}
#zb{position:absolute;left:14px;right:14px;bottom:14px;padding:10px 14px 6px;border-radius:26px;background:rgba(20,20,20,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);z-index:3}
.chips{display:flex;gap:6px}
.c{flex:1;height:34px;border-radius:17px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:13px;transition:background .2s,color .2s,transform .2s}
.c.on{background:linear-gradient(135deg,#ffd33d,#ff8a3d);color:#111;font-weight:700;transform:scale(1.06)}
#zs{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:4px 0 0}
#zs::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--on) var(--p,0%),rgba(255,255,255,.28) var(--p,0%))}
#zs::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#fl.go{opacity:.8;transition:none}
#bar{height:120px;display:flex;align-items:center;justify-content:space-around}
.side{width:54px;height:54px;border-radius:50%;background:var(--side);color:var(--fg);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;padding:0}
#sh{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;transition:transform .12s}
#sh:active{transform:scale(.9)}
#res{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);z-index:8}
#res .out{flex:1;min-height:0}
#out{width:100%;height:100%;object-fit:contain;border-radius:12px}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px 0}
.tabs button{border:0;border-radius:18px;padding:10px 18px;font-size:15px;background:var(--side);color:var(--fg)}
.tabs button.on{background:#fff;color:#000}
.hint{text-align:center;font-size:12px;opacity:.6;padding-bottom:6px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;padding:24px;z-index:9}
</style>
</head>
<body>
<div id="app">
<div id="vf">
<video id="v" autoplay playsinline muted hidden></video>
<img id="im" hidden alt="">
<div id="msg">Membuka kamera...</div>
<div id="zl">1.0x</div>
<div id="tip" hidden></div>
<div id="zb">
<div class="chips"><button class="c on" data-z="1">1x</button><button class="c" data-z="2">2x</button><button class="c" data-z="4">4x</button><button class="c" data-z="8">8x</button></div>
<input id="zs" type="range" min="1" max="8" step="0.01" value="1" aria-label="Zoom">
</div>
<div id="fl"></div>
</div>
<div id="bar">
<button class="side" id="gal" aria-label="Galeri"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="5"/><circle cx="9" cy="10" r="1.8"/><path d="M3.5 17l5-4.5 4 3.5 3-2.5 5 4"/></svg></button>
<button id="sh" aria-label="Jepret"></button>
<button class="side" id="flip" aria-label="Balik kamera"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 0 1 14-3l2 2"/><path d="M20 4v5h-5"/><path d="M20 14a8 8 0 0 1-14 3l-2-2"/><path d="M4 20v-5h5"/></svg></button>
</div>
</div>
<div id="res" hidden>
<div class="out"><img id="out" alt="Hasil"></div>
<div class="tabs"><button id="tb" class="on">Asli</button><button id="ta">AI x4</button><button id="tr">Ulangi</button></div>
<div class="hint">Tekan lama gambar untuk menyimpan. Tab AI memperbesar versi kecil (256 px) 4x, cocok untuk gambar pecah.</div>
</div>
<div id="busy" hidden><div id="bt">Memproses...</div></div>
<input id="fg" type="file" accept="image/*" hidden>
<input id="fc" type="file" accept="image/*" capture="environment" hidden>
<script type="module">
const $=i=>document.getElementById(i);
const v=$('v'),im=$('im'),vf=$('vf'),msg=$('msg');
const flipHTML=$('flip').innerHTML,closeHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
let stream,track,facing='environment',live=false,imgMode=false,hw=null,cur=1,target=1,raf=0,hwBusy=false,wantHz=1,appliedHz=0,urls={},crop=null,tt,W=null,pend=null;
function tip(t,ms=3500){const e=$('tip');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,ms)}
const stat=t=>{$('bt').textContent=t;if($('busy').hidden)tip(t,5000)};
const hzOf=z=>(hw&&!imgMode)?Math.min(Math.max(z,hw.min),hw.max):1;
function pushHw(){if(!hw||imgMode||!track||hwBusy||wantHz===appliedHz)return;hwBusy=true;appliedHz=wantHz;
track.applyConstraints({advanced:[{zoom:appliedHz}]}).catch(()=>{}).finally(()=>{hwBusy=false;pushHw()})}
function applyZoom(){const hz=hzOf(cur);wantHz=hz;pushHw();v.style.transform=im.style.transform='scale('+(cur/hz)+')'}
function tick(){raf=0;const d=target-cur;cur=Math.abs(d)<.004?target:cur+d*.2;applyZoom();if(cur!==target)raf=requestAnimationFrame(tick)}
function setZoom(k){target=Math.max(1,Math.min(8,k));$('zs').value=target;$('zs').style.setProperty('--p',((target-1)/7*100)+'%');
$('zl').textContent=target.toFixed(1)+'x';document.querySelectorAll('.c').forEach(b=>b.classList.toggle('on',Math.abs(b.dataset.z-target)<.15));
if(!raf)raf=requestAnimationFrame(tick)}
document.querySelectorAll('.c').forEach(b=>b.onclick=()=>setZoom(+b.dataset.z));
$('zs').oninput=e=>setZoom(+e.target.value);
let pd=0,pz=1;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
vf.addEventListener('touchstart',e=>{if(e.touches.length==2){pd=dist(e);pz=target}},{passive:true});
vf.addEventListener('touchmove',e=>{if(e.touches.length==2&&pd)setZoom(pz*dist(e)/pd)},{passive:true});
vf.addEventListener('touchend',()=>{pd=0});
async function start(){
setTimeout(()=>{if(!live&&!msg.hidden&&msg.textContent==='Membuka kamera...')msg.textContent='Kamera belum merespons. Tutup tab lain yang memakai kamera, lalu muat ulang halaman.'},7000);
if(stream)stream.getTracks().forEach(t=>t.stop());
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:2560},height:{ideal:1920}},audio:false});
track=stream.getVideoTracks()[0];const c=track.getCapabilities?track.getCapabilities():{};
hw=c.zoom?{min:c.zoom.min,max:c.zoom.max}:null;appliedHz=0;
v.srcObject=stream;await v.play().catch(()=>{});v.hidden=false;live=true;msg.hidden=true;applyZoom()}
catch(e){live=false;v.hidden=true;msg.hidden=false;msg.textContent='Kamera langsung tidak bisa dibuka. Izinkan akses kamera di Chrome, atau tekan jepret untuk memakai kamera HP.'}}
function showImg(f){if(!f)return;im.onload=()=>{imgMode=true;im.hidden=false;v.hidden=true;msg.hidden=true;$('flip').innerHTML=closeHTML;cur=target=1;setZoom(1);applyZoom();tip('Foto dimuat. Atur zoom lalu tekan jepret.')};im.src=URL.createObjectURL(f)}
function closeImg(){imgMode=false;im.hidden=true;$('flip').innerHTML=flipHTML;setZoom(1);applyZoom();if(live)v.hidden=false;else msg.hidden=false}
$('fg').onchange=e=>{showImg(e.target.files[0]);e.target.value=''};
$('fc').onchange=e=>{showImg(e.target.files[0]);e.target.value=''};
$('gal').onclick=()=>$('fg').click();
$('flip').onclick=()=>{if(imgMode)closeImg();else{facing=facing==='environment'?'user':'environment';start()}};
const wsrc=`let pp=null,pipe=null;
const init=()=>pp||(pp=(async()=>{
const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
pipe=await m.pipeline('image-to-image','Xenova/swin2SR-realworld-sr-x4-64-bsrgan-psnr',{dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&p.total)self.postMessage({type:'prog',p:Math.round(p.progress)})}});
self.postMessage({type:'ready'})})().catch(e=>{pp=null;throw e}));
self.onmessage=async e=>{try{await init();if(e.data.type==='run'){const o=await pipe(e.data.data);self.postMessage({type:'done',w:o.width,h:o.height,c:o.channels,buf:o.data})}}
catch(err){self.postMessage({type:'err',m:String((err&&err.message)||err)})}};`;
function getWorker(){
if(!W){W=new Worker(URL.createObjectURL(new Blob([wsrc],{type:'text/javascript'})),{type:'module'});
W.onmessage=e=>{const d=e.data;
if(d.type==='prog')stat('Mengunduh model: '+d.p+'%');
else if(d.type==='ready'){if(!$('busy').hidden)$('bt').textContent='Menjalankan AI... bisa 1-2 menit di HP, jangan ditutup'}
else if(d.type==='done'&&pend){pend.res(d);pend=null}
else if(d.type==='err'){if(pend){pend.rej(new Error(d.m));pend=null}}};
W.onerror=e=>{if(pend){pend.rej(new Error(e.message||'worker error'));pend=null}}}
return W}
const runAI=url=>new Promise((res,rej)=>{pend={res,rej};getWorker().postMessage({type:'run',data:url})});
function toCanvas({data,width,height,channels}){const c=document.createElement('canvas');c.width=width;c.height=height;
const d=new ImageData(width,height);for(let i=0,j=0;i<width*height;i++){d.data[j++]=data[i*channels];d.data[j++]=data[i*channels+1];d.data[j++]=data[i*channels+2];d.data[j++]=255}
c.getContext('2d').putImageData(d,0,0);return c}
async function snap(){
if(!imgMode&&!(live&&v.videoWidth)){$('fc').click();return}
$('fl').classList.add('go');setTimeout(()=>$('fl').classList.remove('go'),60);
$('busy').hidden=false;$('bt').textContent='Mengambil foto...';
try{
let src,sw,sh;
if(imgMode){src=im;sw=im.naturalWidth;sh=im.naturalHeight}
else{let bm=null;
if(typeof ImageCapture!=='undefined'&&track){try{bm=await createImageBitmap(await new ImageCapture(track).takePhoto())}catch(e){}}
if(bm){src=bm;sw=bm.width;sh=bm.height}else{src=v;sw=v.videoWidth;sh=v.videoHeight}}
const ar=vf.clientWidth/vf.clientHeight;
if(!imgMode&&src!==v&&(sw>sh)!==(ar>1)){const r=document.createElement('canvas');r.width=sh;r.height=sw;const g=r.getContext('2d');g.translate(sh,0);g.rotate(Math.PI/2);g.drawImage(src,0,0);src=r;[sw,sh]=[sh,sw]}
let bw,bh;if(sw/sh>ar){bh=sh;bw=sh*ar}else{bw=sw;bh=sw/ar}
const z=cur/hzOf(cur),cw=bw/z,ch=bh/z,s=Math.min(1,2048/Math.max(cw,ch));
const c=document.createElement('canvas');c.width=Math.max(8,Math.round(cw*s));c.height=Math.max(8,Math.round(ch*s));
c.getContext('2d').drawImage(src,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,c.width,c.height);
crop=c;urls={orig:c.toDataURL('image/jpeg',.95)};show('orig');$('res').hidden=false}
catch(e){tip('Gagal mengambil foto: '+(e.message||e),6000)}
$('busy').hidden=true}
async function doAI(){
if(urls.ai){show('ai');return}
$('busy').hidden=false;$('bt').textContent='Menyiapkan AI...';
try{const s=Math.min(1,256/Math.max(crop.width,crop.height));
const a=document.createElement('canvas');a.width=Math.max(8,Math.round(crop.width*s));a.height=Math.max(8,Math.round(crop.height*s));
a.getContext('2d').drawImage(crop,0,0,a.width,a.height);
stat('Menjalankan AI... bisa 1-2 menit di HP, jangan ditutup');
const o=await runAI(a.toDataURL('image/png'));
urls.ai=toCanvas({data:o.buf,width:o.w,height:o.h,channels:o.c}).toDataURL('image/jpeg',.95);show('ai')}
catch(e){tip('AI gagal: '+(e&&e.message?e.message:e),8000)}
$('busy').hidden=true}
function show(k){$('out').src=urls[k];$('ta').classList.toggle('on',k==='ai');$('tb').classList.toggle('on',k==='orig')}
$('tb').onclick=()=>show('orig');$('ta').onclick=doAI;$('tr').onclick=()=>{$('res').hidden=true};
$('sh').onclick=snap;
setZoom(1);start();
</script>
</body>
</html>
